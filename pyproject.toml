[project]
name = "autopyrma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Carlos J. Gil Bellosta", email = "cgb@circiter.es" }
]
requires-python = ">=3.13"
dependencies = [
    "pyhanko>=0.37",
    "cryptography>=42",
    "asn1crypto>=1.5",
    "keyring>=25",
    "platformdirs>=4",
]

[project.scripts]
autopyrma = "autopyrma:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
